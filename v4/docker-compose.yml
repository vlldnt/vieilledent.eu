services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vieilledent-web
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - portfolio

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vieilledent-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge
