server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        # X-Real-IP is set by the host reverse proxy from the real TCP peer
        # (it overwrites any client-supplied value). Forward it untouched so
        # the API rate limit keys on the real client, not on a spoofable
        # X-Forwarded-For entry.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
